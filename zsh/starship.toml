# Uses ANSI palette names only, so caelestia's terminal colour sequences recolour the prompt automatically.
# Glyphs are Nerd Font code points written as \u escapes.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500

format = """
[╭─](bright-black)$os$username$hostname$directory$git_branch$git_state$git_status$python$nodejs$rust$golang$docker_context$nix_shell$direnv
[╰─](bright-black)$character"""

right_format = "$status$cmd_duration$jobs$battery$time"

[os]
disabled = false
style = "blue"
format = "[$symbol ]($style)"

[os.symbols]
Fedora = ""
Linux = ""

[username]
format = "[$user]($style) "
style_user = "green bold"
style_root = "red bold"
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "yellow"

[directory]
style = "cyan bold"
truncation_length = 4
truncation_symbol = "…/"
read_only = " "
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Pictures" = " "
".config" = " "

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_state]
style = "red bold"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "yellow"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "green"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"
style = "red"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "cyan"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue"
only_with_files = true

[nix_shell]
symbol = " "
format = "[$symbol$state]($style) "
style = "blue"

[status]
disabled = false
format = "[✘ $status]($style) "
style = "red bold"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "bright-black"

[jobs]
symbol = ""
format = "[$symbol$number]($style) "
style = "blue"

[battery]
format = "[$symbol$percentage]($style) "
[[battery.display]]
threshold = 30
style = "red bold"

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style)"
style = "bright-black"

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](blue bold)"

[direnv]
disabled = false
format = "[$symbol$loaded]($style) "
symbol = " "
style = "bright-black"
