# Clipboard picker: KoolDots-like (bottom, image previews). Colours come from caelestia's fuzzel.ini.
include=$HOME/.config/fuzzel/fuzzel.ini
anchor=bottom
font=JetBrains Mono NF:size=15
horizontal-pad=16
vertical-pad=10
inner-pad=6
y-margin=24
width=65
lines=6
line-height=44
image-size-ratio=0.45
placeholder=📋 Search clipboard   (Ctrl+Del: delete, Alt+Del: wipe)

[key-bindings]
delete-next-word=Mod1+d
custom-1=Control+Delete
custom-2=Mod1+Delete
