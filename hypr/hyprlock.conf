general {
    fractional_scaling = 2
    immediate_render = true
    ignore_empty_input = false
    hide_cursor = true
}

background {
    monitor = eDP-1
    path = /tmp/hyprlock_eDP-1.png
    blur_size = 7
    blur_passes = 3
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.1
}

background {
    monitor = DP-1
    path = /tmp/hyprlock_DP-1.png
    blur_size = 7
    blur_passes = 3
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.1
}

background {
    monitor = HDMI-A-1
    path = /tmp/hyprlock_HDMI-A-1.png
    blur_size = 7
    blur_passes = 3
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.1)
    capslock_color = rgba(255, 100, 100, 1)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Введите пароль...</i>
    rounding = 10
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -185
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "<b> $($HOME/.config/hypr/scripts/Battery.sh) </b>"
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] echo "<b> $(uptime -p) </b>"
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 50, 0
    halign = left
    valign = bottom
}

auth {
    pam:enabled = true
    fingerprint:enabled = false
}
