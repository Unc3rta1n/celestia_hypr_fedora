# Default Keybinds
# visit https://wiki.hyprland.org/Configuring/Binds/ for more info

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs
$UserScripts = $HOME/.config/hypr/UserScripts

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf

#### STANDARD ####
# Common shortcuts
bindd = $mainMod, SPACE, app launcher, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window
bindd = $mainMod, Return, Open terminal, exec, $term
bindd = $mainMod, code:26, file manager, exec, $files                                # E
bindd = $mainMod, code:54, SSH session manager, exec, $scriptsDir/rofi-ssh-menu.sh  # C

# FEATURES / EXTRAS
bindd = $mainMod, code:28, Global theme switcher using Wallust, exec, $scriptsDir/ThemeChanger.sh  # T
bindd = $mainMod ALT, code:27, refresh bar and menus, exec, $scriptsDir/Refresh.sh                 # R
bindd = $mainMod ALT, code:26, emoji menu, exec, $scriptsDir/RofiEmoji.sh                          # E
bindd = $mainMod ALT, code:32, toggle blur, exec, $scriptsDir/ChangeBlur.sh                        # O
bindd = $mainMod SHIFT, code:41, toggle game mode, exec, $scriptsDir/GameMode.sh                   # G
bindd = $mainMod ALT, code:46, toggle layouts, exec, $scriptsDir/ChangeLayout.sh toggle            # L
bindd = $mainMod ALT, code:55, clipboard manager, exec, $scriptsDir/ClipManager.sh                 # V
bindd = $mainMod CTRL, code:27, rofi theme selector, exec, $scriptsDir/RofiThemeSelector.sh        # R
bindd = $mainMod CTRL SHIFT, code:27, rofi theme selector (modified), exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh  # R
bindd = $mainMod CTRL, code:45, Kitty theme selector, exec, $scriptsDir/Kitty_themes.sh            # K
bindd = ALT SHIFT, code:39, Hyprshot Screen Capture, exec, $scriptsDir/hyprshot.sh -m region -o $HOME/Pictures/Screenshots  # S

bindd = $mainMod SHIFT, code:33, fullscreen, fullscreen                              # F
bindd = $mainMod CTRL, code:33, maximize window, fullscreen, 1                       # F
bindd = $mainMod ALT, SPACE, Float all windows, exec, $scriptsDir/Float-all-Windows.sh
bindd = $mainMod SHIFT, Return, DropDown terminal, exec, $scriptsDir/Dropterminal.sh $term

# Desktop zooming or magnifier
bindd = $mainMod ALT, mouse_down, zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bindd = $mainMod ALT, mouse_up, zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# Waybar / Bar related
bindd = $mainMod CTRL ALT, code:56, toggle waybar on/off, exec, pkill -SIGUSR1 waybar  # B
bindd = $mainMod CTRL, code:56, waybar styles menu, exec, $scriptsDir/WaybarStyles.sh   # B
bindd = $mainMod ALT, code:56, waybar layout menu, exec, $scriptsDir/WaybarLayout.sh    # B

# FEATURES / EXTRAS (UserScripts)
bindd = $mainMod SHIFT, code:58, online music, exec, $UserScripts/RofiBeats.sh          # M
bindd = CTRL ALT, code:25, random wallpaper, exec, $UserScripts/WallpaperRandom.sh      # W
bindd = $mainMod CTRL, code:32, toggle active window opacity, setprop, active opaque toggle  # O
bindd = $mainMod ALT, code:54, calculator, exec, $UserScripts/RofiCalc.sh               # C

bindlnd =, Hyper_L, switch keyboard layout globally, exec, $scriptsDir/KeyboardLayout.sh switch
#bindlnd = SHIFT_L, ALT_L, switch keyboard layout per-window, exec, $scriptsDir/Tak0-Per-Window-Switch.sh toggle
#bindlnd = , Hyper_L, switch keyboard layout per-window, exec, $scriptsDir/Tak0-Per-Window-Switch.sh toggle

# Move current workspaces to monitors (left right up or down)
bindd = $mainMod CTRL, F9, move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL, F10, move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL, F11, move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL, F12, move workspace to down monitor, movecurrentworkspacetomonitor, d


#### SYSTEM ####
bindd = CTRL ALT, Delete, exit Hyprland, exec, hyprctl dispatch exit 0
bindd = $mainMod, code:24, close active window, killactive,                              # Q
bindd = $mainMod SHIFT, code:24, Terminate active process, exec, $scriptsDir/KillActiveProcess.sh  # Q
bindd = CTRL ALT, code:46, lock screen, exec, $scriptsDir/LockScreen.sh                 # L
bindd = CTRL ALT, code:33, powermenu, exec, $scriptsDir/Wlogout.sh                      # P
bindd = $mainMod SHIFT, code:26, Quick settings menu, exec, $scriptsDir/Kool_Quick_Settings.sh  # E

# Master Layout
bindd = $mainMod CTRL, code:38, remove master, layoutmsg, removemaster                  # D
bindd = $mainMod, code:31, add master, layoutmsg, addmaster                             # I
bindd = $mainMod, code:44, cycle next, layoutmsg, cyclenext                             # J
bindd = $mainMod, code:45, cycle previous, layoutmsg, cycleprev                         # K
bindd = $mainMod CTRL, Return, swap with master, layoutmsg, swapwithmaster

# Dwindle Layout
bindd = $mainMod SHIFT, code:31, toggle split (dwindle), layoutmsg, togglesplit         # I
bindd = $mainMod, code:33, toggle pseudo (dwindle), pseudo,                             # P

# Works on either layout (Master or Dwindle)
bindd = $mainMod, code:58, set split ratio 0.3, exec, hyprctl dispatch splitratio 0.3  # M
exec-once = $scriptsDir/ChangeLayout.sh init

# Direct layout binds
bindd = $mainMod ALT, 1, layout dwindle, exec, $scriptsDir/ChangeLayout.sh dwindle
bindd = $mainMod ALT, 2, layout master, exec, $scriptsDir/ChangeLayout.sh master
bindd = $mainMod ALT, 3, layout scrolling, exec, $scriptsDir/ChangeLayout.sh scrolling
bindd = $mainMod ALT, 4, layout monocle, exec, $scriptsDir/ChangeLayout.sh monocle

# Scrolling Layout
bindd = $mainMod SHIFT, period, move to right column, layoutmsg, move +col
bindd = $mainMod SHIFT, comma, move to left column, layoutmsg, move -col
bindd = $mainMod ALT, comma, swap columns left, layoutmsg, swapcol l
bindd = $mainMod ALT, period, swap columns right, layoutmsg, swapcol r

bindd = $mainMod ALT, code:43, Horizonal scroll right, exec, hyprctl keyword scrolling:direction right  # H
bindd = $mainMod ALT, code:55, Vertical Scroll down, exec, hyprctl keyword scrolling:direction down     # V
bindd = $mainMod ALT, code:39, toggle scrolling V/H, exec, bash -c '[[ $(hyprctl getoption scrolling:direction -j | jq -r ".str") == "right" ]] && hyprctl keyword scrolling:direction down || hyprctl keyword scrolling:direction right'  # S

# Cycle windows; if floating bring to top
bindd = ALT, tab, cycle next window, cyclenext
bindd = ALT, tab, bring active to top, bringactivetotop

# Special Keys / Hot Keys
bindeld = , xf86audioraisevolume, volume up, exec, $scriptsDir/Volume.sh --inc
bindeld = , xf86audiolowervolume, volume down, exec, $scriptsDir/Volume.sh --dec
bindeld = ALT, xf86audioraisevolume, volume up precise, exec, $scriptsDir/Volume.sh --inc-precise
bindeld = ALT, xf86audiolowervolume, volume down precise, exec, $scriptsDir/Volume.sh --dec-precise
bindld = , xf86AudioMicMute, toggle mic mute, exec, $scriptsDir/Volume.sh --toggle-mic
bindld = , xf86audiomute, toggle mute, exec, $scriptsDir/Volume.sh --toggle
bindld = , xf86Sleep, sleep, exec, systemctl suspend
bindld = , xf86Rfkill, airplane mode, exec, $scriptsDir/AirplaneMode.sh

# media controls
bindld = , xf86AudioPlayPause, play/pause, exec, $scriptsDir/MediaCtrl.sh --pause
bindld = , xf86AudioPause, pause, exec, $scriptsDir/MediaCtrl.sh --pause
bindld = , xf86AudioPlay, play, exec, $scriptsDir/MediaCtrl.sh --pause
bindld = , xf86AudioNext, next track, exec, $scriptsDir/MediaCtrl.sh --nxt
bindld = , xf86AudioPrev, previous track, exec, $scriptsDir/MediaCtrl.sh --prv
bindld = , xf86audiostop, stop, exec, $scriptsDir/MediaCtrl.sh --stop

# Screenshot
bindd = $mainMod, Print, screenshot now, exec, $scriptsDir/ScreenShot.sh --now
bindd = $mainMod SHIFT, Print, screenshot (area), exec, $scriptsDir/ScreenShot.sh --area
bindd = $mainMod CTRL, Print, screenshot in 5s, exec, $scriptsDir/ScreenShot.sh --in5
bindd = $mainMod CTRL SHIFT, Print, screenshot in 10s, exec, $scriptsDir/ScreenShot.sh --in10
bindd = ALT, Print, screenshot active window, exec, $scriptsDir/ScreenShot.sh --active

# Resize windows
binded = $mainMod SHIFT, left, resize left (-50), resizeactive, -50 0
binded = $mainMod SHIFT, right, resize right (+50), resizeactive, 50 0
binded = $mainMod SHIFT, up, resize up (-50), resizeactive, 0 -50
binded = $mainMod SHIFT, down, resize down (+50), resizeactive, 0 50

# Move windows
bindd = $mainMod CTRL, left, move window left, movewindow, l
bindd = $mainMod CTRL, right, move window right, movewindow, r
bindd = $mainMod CTRL, up, move window up, movewindow, u
bindd = $mainMod CTRL, down, move window down, movewindow, d

# Swap windows
bindd = $mainMod ALT, left, swap window left, swapwindow, l
bindd = $mainMod ALT, right, swap window right, swapwindow, r
bindd = $mainMod ALT, up, swap window up, swapwindow, u
bindd = $mainMod ALT, down, swap window down, swapwindow, d

# group
bindd = $mainMod, code:41, toggle group, togglegroup                                    # G
bindd = $mainMod, Tab, Change Group Forward, changegroupactive, f
bindd = $mainMod CTRL, tab, change active in group, changegroupactive
bindd = $mainMod SHIFT, Tab, Change Group Back, changegroupactive, b
bindd = $mainMod CTRL, code:45, Move left into group, moveintogroup, l                  # K
bindd = $mainMod CTRL, code:46, Move Right into group, moveintogroup, r                 # L
bindd = $mainMod CTRL, code:43, Move active out of group, moveoutofgroup                # H

# Move focus
bindd = $mainMod, left, focus left, movefocus, l
bindd = $mainMod, right, focus right, movefocus, r
bindd = $mainMod, up, focus up, movefocus, u
bindd = $mainMod, down, focus down, movefocus, d

# Workspaces
bindd = $mainMod, tab, next workspace, workspace, m+1
bindd = $mainMod SHIFT, tab, previous workspace, workspace, m-1

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, code:10, workspace 1, workspace, 1
bindd = $mainMod, code:11, workspace 2, workspace, 2
bindd = $mainMod, code:12, workspace 3, workspace, 3
bindd = $mainMod, code:13, workspace 4, workspace, 4
bindd = $mainMod, code:14, workspace 5, workspace, 5
bindd = $mainMod, code:15, workspace 6, workspace, 6
bindd = $mainMod, code:16, workspace 7, workspace, 7
bindd = $mainMod, code:17, workspace 8, workspace, 8
bindd = $mainMod, code:18, workspace 9, workspace, 9
bindd = $mainMod, code:19, workspace 10, workspace, 10

# Move active window to workspace
bindd = $mainMod SHIFT, code:10, move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, code:19, move to workspace 10, movetoworkspace, 10
bindd = $mainMod SHIFT, bracketleft, move to previous workspace, movetoworkspace, -1
bindd = $mainMod SHIFT, bracketright, move to next workspace, movetoworkspace, +1

# Move silently
bindd = $mainMod CTRL, code:10, move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod CTRL, code:15, move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod CTRL, code:16, move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod CTRL, code:17, move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod CTRL, code:18, move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod CTRL, code:19, move silently to workspace 10, movetoworkspacesilent, 10
bindd = $mainMod CTRL, bracketleft, move silently to previous workspace, movetoworkspacesilent, -1
bindd = $mainMod CTRL, bracketright, move silently to next workspace, movetoworkspacesilent, +1

# Scroll through workspaces
bindd = $mainMod, mouse_down, next workspace, workspace, e+1
bindd = $mainMod, mouse_up, previous workspace, workspace, e-1
bindd = $mainMod, period, next workspace, workspace, e+1
bindd = $mainMod, comma, previous workspace, workspace, e-1
bindd = $mainMod, mouse:276, previous workspace, workspace, e-1
bindd = $mainMod, mouse:275, next workspace, workspace, e+1

# Move/resize windows
bindmd = $mainMod, mouse:272, move window, movewindow
bindmd = $mainMod, mouse:273, resize window, resizewindow
