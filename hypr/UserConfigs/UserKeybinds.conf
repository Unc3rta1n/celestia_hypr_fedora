# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
# Russian layout fix - code-based binds
bindd = $mainMod SHIFT, code:39, screenshot (swappy), exec, $scriptsDir/ScreenShot.sh --swappy
bindd = $mainMod SHIFT, code:42, toggle game mode, exec, $scriptsDir/GameMode.sh
bindd = $mainMod SHIFT, code:57, notification panel, exec, swaync-client -t -sw
bindd = $mainMod SHIFT, code:56, Set static Rainbow Border, exec, $UserScripts/RainbowBorders-low-cpu.sh --run-once
bindd = $mainMod SHIFT, code:43, Toggle Mute/Unmute for Active-Window, exec, $scriptsDir/Toggle-Active-Window-Audio.sh
bindd = $mainMod SHIFT, code:25, wallpaper effects, exec, $UserScripts/WallpaperEffects.sh
bindd = $mainMod SHIFT, code:32, change oh-my-zsh theme, exec, $UserScripts/ZshChangeTheme.sh
bindd = $mainMod SHIFT, code:30, move to special workspace, movetoworkspace, special
bindd = $mainMod SHIFT, code:38, animations menu, exec, $scriptsDir/Animations.sh
bindd = $mainMod SHIFT, code:45, search keybinds, exec, $scriptsDir/KeyBinds.sh
bindd = $mainMod, code:25, select wallpaper, exec, $UserScripts/WallpaperSelect.sh
bindd = $mainMod, code:57, toggle night light, exec, $scriptsDir/Hyprsunset.sh toggle
bindd = $mainMod, code:56, open default browser, exec, xdg-open "https://"
bindd = $mainMod, code:40, Float current window, togglefloating,
bindd = $mainMod, code:38, desktop overview, exec, $scriptsDir/OverviewToggle.sh
bindd = $mainMod, code:43, help / cheat sheet, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod, code:39, web search, exec, $scriptsDir/RofiSearch.sh
bindd = $mainMod CTRL, code:39, window switcher, exec, rofi -show window
