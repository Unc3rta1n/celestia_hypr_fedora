# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

device {
    name = syn1b8b:00-06cb:ce7d-touchpad
    sensitivity = 0
}
device {
    name = logitech-g304-1
    sensitivity = -0.75
}


general {
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(595959aa)
    border_size = 2
}

input {
    follow_mouse = 1
    numlock_by_default = true
    resolve_binds_by_sym = true
    scroll_button = 0
}
misc {
    vrr = 0
}

cursor {
    no_warps = false
    warp_on_change_workspace = 1
    no_hardware_cursors = true
    use_cpu_buffer = true
}
binds {
    focus_preferred_method = 1
    movefocus_cycles_fullscreen = false
}
